<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="dist/popup.css">
  <script src="dist/popup.js"></script>
</head>
<body class="bg-gray-50 font-[system-ui,-apple-system,sans-serif] antialiased">
  <div class="w-[380px] flex flex-col">
    <div class="flex items-center gap-2 px-4 py-3 border-b border-gray-200 bg-white">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 20H2"/>
        <path d="M11 4.562v16.157a1 1 0 0 0 1.242.97L19 20V5.562a2 2 0 0 0-1.515-1.94l-4-1A2 2 0 0 0 11 4.561z"/>
        <path d="M11 4H8a2 2 0 0 0-2 2v14"/>
        <path d="M14 12h.01"/>
        <path d="M22 20h-3"/>
      </svg>
      <span class="text-sm font-semibold text-gray-900">Portico</span>
    </div>

    <div class="p-4 flex flex-col gap-3">
      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-gray-500 uppercase tracking-wide">Title</label>
        <input id="title-input" type="text" class="text-sm px-3 py-2 border border-gray-200 rounded-lg bg-white text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-rose-200 focus:border-rose-300 transition">
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-gray-500 uppercase tracking-wide">URL</label>
        <input id="url-input" type="text" class="text-sm px-3 py-2 border border-gray-200 rounded-lg bg-white text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-rose-200 focus:border-rose-300 transition">
      </div>

      <button class="mt-1 bg-rose-500 hover:bg-rose-600 active:bg-rose-700 rounded-lg px-3 py-2 text-sm font-medium text-white cursor-pointer transition">Save</button>
    </div>
  </div>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portico</title>
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('portico-prefs') || '{}')
        document.documentElement.dataset.theme = p.state?.theme || 'light'
      } catch (e) { document.documentElement.dataset.theme = 'light' }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
